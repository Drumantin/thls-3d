<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>iPhone 17 Pro Max — Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

  :root{
    --bg:#070707;
    --accent:#FF6A1A;
    --cyan:#14E0C8;
    --violet:#8A6CFF;
    --ink:#f4f1ee;
    --dim:rgba(244,241,238,.46);
    --hair:rgba(244,241,238,.12);
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --sans:"Inter",-apple-system,system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* tall scroll track */
  #track{position:relative;height:1000vh;}
  #stage{position:sticky;top:0;height:100vh;width:100%;overflow:hidden;background:var(--bg);}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;}

  /* ---- cinematic letterbox bars ---- */
  .cine-bar{position:absolute;left:0;right:0;height:0;background:#000;z-index:24;pointer-events:none;}
  .cine-bar.top{top:0;}
  .cine-bar.bot{bottom:0;}

  /* ---- loader ---- */
  #loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:var(--bg);z-index:45;transition:opacity .8s ease;}
  #loader.hide{opacity:0;pointer-events:none;}
  #loader .ldr-ring, #loader .ldr-txt, #loader .ldr-pct{display:none;}
  .ldr-ring{width:38px;height:38px;border:1.5px solid var(--hair);border-top-color:var(--accent);border-radius:50%;
    animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ldr-txt{font-family:var(--mono);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);}
  .ldr-pct{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--accent);}

  /* ---- HUD ---- */
  #hud{position:absolute;inset:0;z-index:20;pointer-events:none;}
  .vfade{position:absolute;inset:0;background:
    radial-gradient(130% 95% at 50% 48%, transparent 52%, rgba(0,0,0,.55) 100%);}

  /* persistent chrome */
  .chrome{position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);}
  .brand{top:34px;right:38px;text-align:right;line-height:1.7;}
  .brand b{color:var(--ink);font-weight:500;}
  .credit{bottom:20px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.14em;color:rgba(244,241,238,.3);
    white-space:nowrap;text-transform:none;}
  .credit a{color:rgba(244,241,238,.42);text-decoration:none;}

  /* progress rail (right dots) */
  .rail{position:absolute;top:50%;right:34px;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;align-items:center;}
  .rail .dot{width:6px;height:6px;border-radius:50%;background:var(--hair);transition:all .4s ease;}
  .rail .dot.on{background:var(--accent);box-shadow:0 0 12px rgba(255,106,26,.7);transform:scale(1.4);}

  /* bottom progress bar */
  #prog{position:absolute;left:0;bottom:0;height:2px;width:0;z-index:30;
    background:linear-gradient(90deg, var(--accent), #ffb27a);
    box-shadow:0 0 12px rgba(255,106,26,.9);}

  /* section overlay */
  .sec{position:absolute;inset:0;opacity:0;will-change:opacity;}
  .sec .tl{position:absolute;top:36px;left:40px;}
  .sec .kicker{display:flex;align-items:center;gap:14px;}
  .sec .num{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--accent);}
  .sec .num::after{content:"";display:inline-block;width:46px;height:1px;background:var(--accent);vertical-align:middle;margin-left:14px;opacity:.6;}
  .sec .name{font-family:var(--sans);font-weight:700;font-size:31px;letter-spacing:-.02em;margin-top:14px;line-height:1.04;
    max-width:8ch;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.6);}
  @keyframes nameIn{
    0%{transform:translateY(26px) scale(.965);}
    58%{transform:translateY(-3px) scale(1.012);}
    100%{transform:translateY(0) scale(1);}}
  .sec .tag{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);margin-top:11px;}
  .sec.show .name{animation:nameIn .72s cubic-bezier(.2,.9,.2,1.06) both;}
  @keyframes bigIn{0%{transform:scale(.76);}55%{transform:scale(1.05);}100%{transform:scale(1);}}
  .sec.show .big{animation:bigIn .62s cubic-bezier(.2,.8,.25,1) both;transform-origin:right bottom;}

  /* holographic glass spec panel bottom-left */
  .sec .bl{position:absolute;bottom:52px;left:40px;display:flex;flex-direction:column;gap:2px;
    padding:18px 22px 16px;border-radius:16px;isolation:isolate;min-width:276px;
    background:linear-gradient(135deg, rgba(255,106,26,.07), rgba(20,224,200,.045) 60%, rgba(138,108,255,.05));
    backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 12px 50px rgba(0,0,0,.5), 0 0 40px rgba(255,106,26,.06);
    transform:translateY(0);transition:transform .6s cubic-bezier(.16,1,.3,1);}
  .sec.show .bl{animation:floaty 7s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
  .sec .bl::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:conic-gradient(from var(--a), var(--accent), var(--cyan), var(--violet), var(--accent));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;opacity:.5;
    animation:spin-a 9s linear infinite;}
  @keyframes spin-a{to{--a:360deg;}}
  .sec .bl::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.08) 47%, transparent 60%);
    background-size:280% 100%;animation:sheen 6s ease-in-out infinite;mix-blend-mode:screen;}
  @keyframes sheen{0%{background-position:160% 0;}55%,100%{background-position:-60% 0;}}
  .sec .pl{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);
    opacity:.7;margin-bottom:8px;}
  .sec .spec{display:flex;align-items:baseline;gap:14px;padding:7px 0;border-top:1px solid var(--hair);}
  .sec .spec:first-of-type{border-top:none;}
  @keyframes specIn{from{transform:translateX(-12px);}to{transform:translateX(0);}}
  .sec.show .spec{animation:specIn .6s cubic-bezier(.16,1,.3,1) both;}
  .sec.show .spec:nth-of-type(2){animation-delay:.06s;}
  .sec.show .spec:nth-of-type(3){animation-delay:.13s;}
  .sec.show .spec:nth-of-type(4){animation-delay:.20s;}
  .sec.show .spec:nth-of-type(5){animation-delay:.27s;}
  .sec .spec .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);flex:1;}
  .sec .spec .v{font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:var(--ink);font-weight:500;white-space:nowrap;}
  .sec .spec .v em{color:var(--accent);font-style:normal;}

  /* big number bottom-right */
  .sec .br{position:absolute;bottom:46px;right:42px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;}
  .sec .big{font-family:var(--mono);font-weight:300;font-size:clamp(76px,13vw,184px);line-height:.82;color:var(--ink);
    font-variant-numeric:tabular-nums;letter-spacing:-.04em;text-shadow:0 0 40px rgba(255,106,26,.18);}
  .sec .big .u{font-size:.27em;color:var(--accent);font-weight:400;letter-spacing:.02em;margin-left:.12em;}
  .sec .blbl{font-family:var(--mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin-top:12px;}

  /* ---- finale CTA scene ---- */
  #beatFade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:23;}
  #titleCard{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:46;pointer-events:none;background:radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 38%, rgba(0,0,0,.55) 100%);}
  #titleCard .tc-inner{display:flex;flex-direction:column;align-items:center;text-align:center;}
  #titleCard .tc-line{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-bottom:26px;}
  #titleCard .tc-name{font-family:var(--sans);font-weight:800;font-size:clamp(34px,6vw,82px);letter-spacing:-.04em;line-height:1;
    background:linear-gradient(180deg,#fff,rgba(244,241,238,.55));-webkit-background-clip:text;background-clip:text;color:transparent;}
  #titleCard .tc-sub{font-family:var(--mono);font-size:clamp(9px,1vw,12px);letter-spacing:.3em;text-transform:uppercase;
    color:var(--dim);margin-top:20px;white-space:nowrap;}
  .sec-cta .cta{position:absolute;left:0;right:0;bottom:9vh;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;padding:0 24px;}
  .cta-kick{font-family:var(--mono);font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;}
  .cta-hero{font-family:var(--sans);font-weight:800;font-size:clamp(34px,5.4vw,68px);letter-spacing:-.035em;line-height:.98;
    background:linear-gradient(180deg,#fff,rgba(244,241,238,.62));-webkit-background-clip:text;background-clip:text;color:transparent;
    text-wrap:balance;}
  .cta-sub{font-family:var(--sans);font-weight:400;font-size:clamp(13px,1.4vw,17px);color:var(--dim);margin-top:14px;letter-spacing:.01em;}
  .cta-btn{pointer-events:none;cursor:pointer;margin-top:30px;display:inline-flex;align-items:center;gap:12px;
    font-family:var(--sans);font-weight:600;font-size:16px;letter-spacing:.01em;color:#0a0a0a;
    padding:16px 40px;border:none;border-radius:100px;background:var(--accent);
    box-shadow:0 10px 40px rgba(255,106,26,.4), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease, background .25s ease;}
  .sec-cta.show .cta-btn{pointer-events:auto;}
  .cta-btn:hover{transform:translateY(-2px) scale(1.02);background:#ff7d36;box-shadow:0 16px 54px rgba(255,106,26,.55), inset 0 1px 0 rgba(255,255,255,.35);}
  .cta-btn:active{transform:translateY(0) scale(.99);}
  .cta-arrow{transition:transform .25s cubic-bezier(.16,1,.3,1);}
  .cta-btn:hover .cta-arrow{transform:translateX(5px);}
  @media(max-width:720px){ .cta-btn{padding:14px 34px;font-size:15px;} .sec-cta .cta{bottom:7vh;} }

  /* scroll hint */
  #hint{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;
    letter-spacing:.34em;text-transform:uppercase;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:opacity .5s ease;z-index:26;}
  #hint .ln{width:1px;height:32px;background:linear-gradient(var(--accent),transparent);animation:drop 1.8s ease-in-out infinite;}
  @keyframes drop{0%,100%{opacity:.2;transform:scaleY(.5);transform-origin:top;}50%{opacity:1;transform:scaleY(1);}}

  /* exploded-view labels */
  .exDot{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;background:#7fd0ff;box-shadow:0 0 10px rgba(127,208,255,.95);}
  .exLeader{position:absolute;left:0;width:1px;background:linear-gradient(rgba(127,208,255,.7),rgba(127,208,255,.15));}
  .exTxt{position:absolute;left:0;white-space:nowrap;transform:translate(-50%,-50%);padding:3px 9px;border-radius:6px;
    background:rgba(10,16,22,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(127,208,255,.2);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:#e7f2ff;text-shadow:0 1px 6px rgba(0,0,0,.7);}

  @media(max-width:720px){
    .sec .name{font-size:22px;}
    .sec .tag{font-size:8.5px;}
    .sec .tl{left:20px;top:22px;}
    .brand{right:18px;top:20px;font-size:9px;}
    .rail{display:none;}
    .credit{font-size:8px;bottom:12px;}
    /* вертикальная раскладка низа: большая цифра НАД панелью, без наложений */
    .sec .br{right:16px;left:auto;bottom:258px;align-items:flex-end;text-align:right;}
    .sec .big{font-size:clamp(40px,11vw,56px);line-height:.84;}
    .sec .big .u{font-size:.3em;}
    .sec .blbl{font-size:7px;letter-spacing:.14em;margin-top:5px;}
    .sec .bl{left:14px;right:14px;bottom:90px;min-width:0;padding:11px 14px 9px;}
    .sec .pl{font-size:7.5px;letter-spacing:.22em;margin-bottom:5px;}
    .sec .spec{padding:4px 0;gap:10px;}
    .sec .spec .k{font-size:8.5px;letter-spacing:.08em;}
    .sec .spec .v{font-size:10px;}
  }
</style>
</head>
<body>
  <div id="track">
    <div id="stage">
      <canvas id="gl"></canvas>

      <div id="hud">
        <div class="vfade"></div>
        <div id="sections"></div>
      </div>

      <div id="prog"></div>

      <div id="beatFade"></div>

      <div id="titleCard">
        <div class="tc-inner">
          <div class="tc-line"></div>
          <div class="tc-name">iPhone 17 Pro Max</div>
          <div class="tc-sub">Aerospace aluminium · A19 Pro</div>
        </div>
      </div>

      <div id="loader">
        <div class="ldr-ring"></div>
        <div class="ldr-txt">Загрузка модели</div>
        <div class="ldr-pct" id="pct">0%</div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const MODEL_URL = 'https://cdn.jsdelivr.net/gh/Drumantin/thls-3d@main/iphone17-plain.glb';
const TAU = Math.PI * 2;

const MOBILE = matchMedia('(max-width:720px)').matches || (('ontouchstart' in window) && innerWidth < 900);
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

// adaptive track length
document.getElementById('track').style.height = (MOBILE ? 1100 : 1560) + 'vh';

const COL_ORANGE = new THREE.Color('#FF6A1A');
const COL_CYAN   = new THREE.Color('#14E0C8');
const COL_VIOLET = new THREE.Color('#8A6CFF');
// colorway finishes for the body switch (null = keep model's native Cosmic-Orange base)
// official Apple finishes: Deep Blue #32374A · Silver #F5F5F5 · Cosmic Orange #F77E2D
const FINISH = [null, new THREE.Color('#32374A'), new THREE.Color('#E9EAEC')]; // Cosmic Orange · Deep Blue · Silver
const FINISH_NAME = ['Cosmic Orange', 'Deep Blue', 'Silver'];
const _fa = new THREE.Color(), _fb = new THREE.Color(), _ft = new THREE.Color();
const _projV = new THREE.Vector3(), _sparkV = new THREE.Vector3();

/* ============================================================
   SECTION DATA  (HUD content + camera keyframes)
   azimuth: model camera-block faces ~0.9 rad (≈52°), screen opposite (≈232°)
   ============================================================ */
const AZ_CAM = 51.6;          // camera-block azimuth (deg) ≈ 0.9 rad
const AZ_SCREEN = AZ_CAM + 180; // front/screen azimuth ≈ 231.6°

const SECTIONS = [
  { num:'01', name:'Дизайн', tag:'Aerospace grade · 2025',
    panel:'CHASSIS',
    specs:[['Корпус','<em>АЛЮМИНИЙ</em>'],['Охлаждение','VAPOR CHAMBER'],['Защита','CERAMIC SHIELD 2']],
    big:{ to:17, unit:'', label:'Поколение' },
    theta: AZ_CAM-104, phi:80, dist:1.42, fov:31, roll:-4, ty:0.0, tx:0.0 },     // establishing far 3/4

  { num:'02', name:'Cosmic Orange', tag:'Heat-forged aluminium',
    panel:'FINISH', specs:[['Финиш','<em>COSMIC ORANGE</em>'],['Корпус','АЛЮМИНИЙ'],['Покрытие','МАТОВОЕ']],
    colors:true, fin:0,
    theta: 150, phi:90, dist:1.46, fov:30, roll:0, ty:0.0, tx:0.0 },       // turntable start

  { num:'03', name:'Deep Blue', tag:'Heat-forged aluminium',
    panel:'FINISH', specs:[['Финиш','<em>DEEP BLUE</em>'],['Корпус','АЛЮМИНИЙ'],['Покрытие','МАТОВОЕ']],
    colors:true, fin:1,
    theta: 510, phi:90, dist:1.46, fov:30, roll:0, ty:0.0, tx:0.0 },       // +360° full turn

  { num:'04', name:'Silver', tag:'Heat-forged aluminium',
    panel:'FINISH', specs:[['Финиш','<em>SILVER</em>'],['Корпус','АЛЮМИНИЙ'],['Покрытие','МАТОВОЕ']],
    colors:true, fin:2,
    theta: 870, phi:90, dist:1.46, fov:30, roll:0, ty:0.0, tx:0.0 },       // +360° full turn

  { num:'05', name:'A19 Pro', tag:'3 нм · разбор конструкции',
    panel:'SILICON',
    specs:[['CPU','<em>6</em> ядер'],['GPU','<em>6</em> ядер'],['Vapor chamber','×1'],['Аккумулятор','4823 мА·ч']],
    big:{ to:6, unit:'', label:'Ядер CPU' },
    explode:true,
    theta: 758, phi:82, dist:1.92, fov:34, roll:0, ty:0.0, tx:0.0 },       // (=38°) side 3/4 — layers fan out along X

  { num:'06', name:'Камера', tag:'Pro Fusion System',
    panel:'OPTICS',
    specs:[['Основной','<em>48</em> МП'],['Ультраширок','48 МП'],['Телефото','48 МП · 8×'],['Фронтальная','18 МП']],
    big:{ to:48, unit:'МП', label:'Pro сенсор' },
    macro:true,
    theta: 771.6, phi:73, dist:0.60, fov:26, roll:-4, ty:0.46, tx:-0.03 },        // (=51.6°) MACRO on camera block

  { num:'07', name:'Дисплей', tag:'Super Retina XDR',
    panel:'DISPLAY',
    specs:[['Диагональ','6.9″ OLED'],['Разрешение','2868×1320'],['Частота','120 Гц'],['Яркость','<em>3000</em> нит']],
    big:{ to:3000, unit:'нит', label:'Пиковая яркость' },
    display:true,
    theta: 990, phi:90, dist:1.02, fov:30, roll:0, ty:-0.02, tx:0.0 },       // (=270°) FRONT-ON (screen faces -X)

  { num:'08', name:'Каждая деталь', tag:'Точность · до микрона',
    panel:'POWER',
    specs:[['Видео','до <em>39</em> ч'],['Разъём','USB-C 3.2'],['Чип','A19 Pro']],
    big:{ to:39, unit:'ч', label:'Воспроизведение видео' },
    engrave:true,
    theta: 815, phi:91, dist:0.92, fov:28, roll:0, ty:-0.26, tx:0.0 },   // (=95°) close near-straight back — engraving hero

  { num:'09', name:'iPhone 17 Pro Max', tag:'',
    cta:true, hero:'iPhone 17 Pro Max', sub:'Алюминий. A19 Pro. Pro Fusion камера.',
    theta: 964, phi:84, dist:1.40, fov:28, roll:0, ty:-0.30, tx:0.0 },     // (=244°) hero finale
];
const NSEG = SECTIONS.length - 1;
const IDX = {
  colors:  SECTIONS.findIndex((s) => s.colors),
  explode: SECTIONS.findIndex((s) => s.explode),
  macro:   SECTIONS.findIndex((s) => s.macro),
  display: SECTIONS.findIndex((s) => s.display),
  engrave: SECTIONS.findIndex((s) => s.engrave),
};

/* ============================================================
   BUILD HUD DOM
   ============================================================ */
const secWrap = document.getElementById('sections');
const secEls = [];
SECTIONS.forEach((s) => {
  const el = document.createElement('div');
  el.className = 'sec' + (s.cta ? ' sec-cta' : '');
  el.setAttribute('data-screen-label', s.num + ' ' + s.name);
  if (s.cta) {
    el.innerHTML = `
      <div class="cta">
        <div class="cta-hero">${s.hero}</div>
        <div class="cta-sub">${s.sub}</div>
        <button class="cta-btn" type="button">Купить<span class="cta-arrow">→</span></button>
      </div>`;
  } else {
    const specRows = s.specs.map(([k, v]) => `<div class="spec"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
    const big = s.big

/* ============================================================
   MASSIVE PARTICLE FIELD (orange + cyan spiral)
   ============================================================ */
const P_COUNT = REDUCE ? 250 : (MOBILE ? 900 : 3600);
const pSeed = new Float32Array(P_COUNT * 3);
const pMix = new Float32Array(P_COUNT);
for (let i = 0; i < P_COUNT; i++) {
  pSeed[i*3]   = Math.random();         // angle seed
  pSeed[i*3+1] = Math.random();         // radius seed
  pSeed[i*3+2] = Math.random();         // height / speed seed
  pMix[i] = Math.random() < 0.62 ? Math.random() * 0.18 : 0.55 + Math.random() * 0.45;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(P_COUNT * 3), 3)); // dummy, computed in shader
pGeo.setAttribute('aSeed', new THREE.BufferAttribute(pSeed, 3));
pGeo.setAttribute('aMix', new THREE.BufferAttribute(pMix, 1));
pGeo.setDrawRange(0, P_COUNT);
const pMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: {
    uTime: { value: 0 }, uScroll: { value: 0 }, uBurst: { value: 0 }, uConverge: { value: 0 }, uFade: { value: 1 },
    uBase: { value: 1.5 }, uPR: { value: Math.min(devicePixelRatio, 2) },
    cOrange: { value: COL_ORANGE }, cCyan: { value: COL_CYAN },
  },
  vertexShader: `
    uniform float uTime, uScroll, uBurst, uConverge, uBase, uPR, uFade;
    attribute vec3 aSeed; attribute float aMix;
    varying vec3 vCol; varying float vA;
    void main(){
      float sa = aSeed.x, sr = aSeed.y, ss = aSeed.z;
      // motion is driven by SCROLL, not time — particles are near-static when idle
      float ang = sa * 6.2831 + uScroll * 3.0;
      float radius = uBase * (0.55 + sr * 2.1) * (1.0 + uBurst * 0.8) * (1.0 - uConverge * 0.68);
      float h = (fract(ss + uScroll * 0.6) - 0.5) * uBase * 3.4 * (1.0 - uConverge * 0.55);
      vec3 p = vec3(cos(ang) * radius, h, sin(ang) * radius);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      // static per-particle brightness (no time term -> no flicker)
      float tw = 0.8 + 0.2 * sin(sa * 24.0);
      gl_PointSize = uBase * (1.4 + sr * 4.0) * tw * uPR * (1.0 / max(-mv.z, 0.1));
      gl_Position = projectionMatrix * mv;
      vCol = mix(vec3(1.0,0.42,0.10), vec3(0.08,0.88,0.78), aMix);
      vA = (0.30 + 0.55 * tw) * (1.0 - uBurst * 0.2) * uFade;
    }`,
  fragmentShader: `
    varying vec3 vCol; varying float vA;
    void main(){
      vec2 c = gl_PointCoord - 0.5; float d = length(c);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(vCol, a * vA);
    }`
});
const particles = new THREE.Points(pGeo, pMat);

const Anamorphic = {
  uniforms: { tDiffuse: { value: null }, uTexel: { value: new THREE.Vector2(1 / innerWidth, 1 / innerHeight) }, uStrength: { value: 0.55 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uTexel; uniform float uStrength; varying vec2 vUv;
    void main(){
      vec4 base = texture2D(tDiffuse, vUv);
      vec3 streak = vec3(0.0); float total = 0.0;
      for (float i = -10.0; i <= 10.0; i += 1.0) {
        float w = 1.0 - abs(i) / 11.0;
        vec3 s = texture2D(tDiffuse, vUv + vec2(i * uTexel.x * 7.0, 0.0)).rgb;
        float b = max(max(s.r, s.g), s.b);
        streak += s * smoothstep(0.62, 1.0, b) * w;
        total += w;
      }
      streak /= total;
      gl_FragColor = vec4(base.rgb + streak * vec3(0.35, 0.62, 1.0) * uStrength, base.a);
    }`
};
const anamorphicPass = new ShaderPass(Anamorphic);
composer.addPass(anamorphicPass);
composer.addPass(new OutputPass());

/* radial depth-of-field — sharp centered subject, soft blurred surroundings (bokeh feel) */
const RadialDoF = {
  uniforms: {
    tDiffuse: { value: null }, uStrength: { value: 0 }, uFocus: { value: 0.32 },
    uTexel: { value: new THREE.Vector2(1 / innerWidth, 1 / innerHeight) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uStrength, uFocus; uniform vec2 uTexel; varying vec2 vUv;
    void main(){
      vec2 d = vUv - 0.5;
      float r = length(d) * 1.16;
      float amt = smoothstep(uFocus, 1.0, r) * uStrength;
      vec4 base = texture2D(tDiffuse, vUv);
      if (amt < 0.001) { gl_FragColor = base; return; }
      vec4 sum = base;
      for (float i = 0.0; i < 16.0; i++) {
        float a = i * 2.3999632;
        float rad = sqrt((i + 0.5) / 16.0);
        vec2 off = vec2(cos(a), sin(a)) * rad * amt * 22.0 * uTexel;
        sum += texture2D(tDiffuse, vUv + off);
      }
      gl_FragColor = sum / 17.0;
    }`
};
const dofPass = new ShaderPass(RadialDoF);
composer.addPass(dofPass);

const GrainVignette = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uGrain: { value: 0.022 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uGrain; varying vec2 vUv;
    float rand(vec2 c){ return fract(sin(dot(c, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec4 col = texture2D(tDiffuse, vUv);
      vec2 d = vUv - 0.5;
      float vig = smoothstep(0.98, 0.28, length(d) * 1.22);
      col.rgb *= mix(0.46, 1.0, vig);
      float gr = (rand(vUv * vec2(1037.0,991.0) + uTime) - 0.5) * uGrain;
      col.rgb += gr;
      gl_FragColor = col;
    }`
};
const grainPass = new ShaderPass(GrainVignette);
composer.addPass(grainPass);

/* directional motion blur — engages only on fast scroll (sells speed, no idle cost) */
const MotionBlur = {
  uniforms: { tDiffuse: { value: null }, uAmt: { value: 0 }, uDir: { value: new THREE.Vector2(1, 0) }, uTexel: { value: new THREE.Vector2(1 / innerWidth, 1 / innerHeight) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uAmt; uniform vec2 uDir, uTexel; varying vec2 vUv;
    void main(){
      if (uAmt < 0.001) { gl_FragColor = texture2D(tDiffuse, vUv); return; }
      vec2 step = uDir * uAmt * 26.0 * uTexel;
      vec4 sum = vec4(0.0); float w = 0.0;
      for (float i = -4.0; i <= 4.0; i += 1.0) {
        float wi = 1.0 - abs(i) / 5.0;
        sum += texture2D(tDiffuse, vUv + step * (i / 4.0)) * wi; w += wi;
      }
      gl_FragColor = sum / w;
    }`
};
const motionPass = new ShaderPass(MotionBlur);
composer.addPass(motionPass);

const pctEl = document.getElementById('pct');
const loaderEl = document.getElementById('loader');
const target = new THREE.Vector3(0, 0, 0);
let fitDist = 6, modelRadius = 1.5;
let ready = false;
let phoneMats = [];
let dissolvePts = null, dissolveMat = null;
let screenMesh = null;
let screenPlane = null;
let wallpaperTex = null;
let floorRef = null, groundShadow = null;
let dropletGroup = null, droplets = [];
let introStart = 0;
// explode / x-ray / color / engraving state

let bodyMats = [];           // materials whose color is swapped by the colorway switch
let engraveMat = null, engraveCanvas = null, engraveCtx = null, sparkPts = null, sparkMat = null;
const PHONE_X = new THREE.Vector3(1, 0, 0);   // world thickness axis (front -X, back +X)

const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(draco);
gltfLoader.setMeshoptDecoder(MeshoptDecoder);

gltfLoader.load(MODEL_URL, (gltf) => {
  const model = gltf.scene;

  // material tuning
  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  wallpaperTex = makeWallpaperTex();
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = false;
    if (/screen/.test((o.name || '').toLowerCase())) screenMesh = o;   // remember display mesh for plane placement
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m) => {
      if (!m) return;
      // anisotropic filtering on all maps — kills streaky aliasing on macro close-ups (lidar etc.)
      ['map','normalMap','roughnessMap','metalnessMap','aoMap','emissiveMap','clearcoatRoughnessMap'].forEach((slot) => {
        const tex = m[slot];
        if (tex && tex.isTexture) { tex.anisotropy = maxAniso; tex.needsUpdate = true; }
      });
      if (m.envMapIntensity !== undefined) m.envMapIntensity = 1.5;
      const nm = ((m.name || '') + ' ' + (o.name || '')).toLowerCase();
      if (/frame|metal|titan|alumin|steel|edge|rail|band|button|side/.test(nm)) {
        if (m.metalness !== undefined) m.metalness = 1.0;
        if (m.roughness !== undefined) m.roughness = 0.28;
      } else if (/back|glass|rear|cover|body|panel/.test(nm)) {
        if (m.metalness !== undefined) m.metalness = 0.4;
        if (m.roughness !== undefined) m.roughness = 0.45;
      }
      // lidar sensor (black.002) is coplanar with the camera-bump panel → z-fighting (running stripes).
      // bias it forward in the depth buffer so it always wins cleanly.
      if (/black\.002/.test((m.name || '').toLowerCase())) {
        m.polygonOffset = true; m.polygonOffsetFactor = -4; m.polygonOffsetUnits = -4;
      }
      m.transparent = true;            // allow dissolve fade
      m._baseOpacity = (m.opacity !== undefined) ? m.opacity : 1;
      // body/frame materials whose finish the colorway switch tints — detect by warm aluminium tone
      if (m.color && m.color.r > 0.45 && m.color.b < m.color.r * 0.72 && m.color.g < m.color.r) {
        m._baseColor = m.color.clone();
        m._baseMetal = m.metalness;
        m._baseRough = m.roughness;
        bodyMats.push(m);
      }
      m.needsUpdate = true;
      phoneMats.push(m);
    });
  });

  // normalize: max dimension -> 2.8 units, then center
  let box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  model.scale.setScalar(2.8 / maxDim);
  model.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  scene.add(model);
  model.updateMatrixWorld(true);

  box = new THREE.Box3().setFromObject(model);
  modelRadius = box.getBoundingSphere(new THREE.Sphere()).radius;

  // fit distance from bounding sphere (reference fov 30, margin)
  const vFov = THREE.MathUtils.degToRad(30);
  fitDist = (modelRadius / Math.sin(vFov / 2)) * 1.12;

  // glow + particle scale relative to model
  glow.scale.setScalar(modelRadius * 6.5);
  pMat.uniforms.uBase.value = modelRadius;
  explodeDist = modelRadius * 0.34;   // per-factor separation distance for the exploded view
  buildFloor(box.min.y * 1.002);
  buildShafts();

  // ---- build dissolve cloud from surface vertices ----
  buildDissolve(model);
  // ---- build the controllable display plane exactly on the screen mesh ----
  buildScreenPlane();
  // ---- exploded view layers + synthetic internals + laser-engrave overlay ----
  try { buildExplode(model, box); } catch (e) { console.error('buildExplode failed', e); window.__buildErr = 'explode: ' + (e && e.message); }
  try { buildEngrave(model, box); } catch (e) { console.error('buildEngrave failed', e); window.__buildErr = (window.__buildErr || '') + ' engrave: ' + (e && e.message); }
  try { buildDroplets(box); } catch (e) { console.error('buildDroplets failed', e); }

  ready = true;
  introStart = REDUCE ? -99999 : performance.now();
  loaderEl.classList.add('hide');
  setTimeout(() => { loaderEl.style.display = 'none'; }, 850);
}, (e) => {
  if (e.total) pctEl.textContent = Math.min(Math.round((e.loaded / e.total) * 100), 100) + '%';
}, (err) => {
  pctEl.textContent = 'Ошибка загрузки';
  console.error('GLTF load error', err);
});

function buildDissolve(model) {
  const raw = [];
  const v = new THREE.Vector3();
  model.traverse((o) => {
    if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
    const posA = o.geometry.attributes.position;
    const mw = o.matrixWorld;
    const stride = Math.max(1, Math.floor(posA.count / 4000));
    for (let i = 0; i < posA.count; i += stride) {
      v.fromBufferAttribute(posA, i).applyMatrix4(mw);
      raw.push(v.x, v.y, v.z);
    }
  });
  const n = raw.length / 3;
  const TARGET = REDUCE ? 0 : (MOBILE ? 2200 : 7000);
  if (TARGET === 0 || n === 0) return;
  const stride2 = Math.max(1, Math.floor(n / TARGET));
  const pos = [], scat = [], mix = [], seed = [];
  for (let i = 0; i < n; i += stride2) {
    const x = raw[i*3], y = raw[i*3+1], z = raw[i*3+2];
    pos.push(x, y, z);
    const len = Math.hypot(x, y, z) || 1;
    const sc = 0.7 + Math.random() * 1.6;
    scat.push((x/len)*sc + (Math.random()-0.5)*0.6,
              (y/len)*sc + (Math.random()-0.5)*0.6 + 0.3,
              (z/len)*sc + (Math.random()-0.5)*0.6);
    mix.push(Math.random() < 0.7 ? Math.random()*0.2 : 0.6 + Math.random()*0.4);
    seed.push(Math.random());
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.setAttribute('aScatter', new THREE.BufferAttribute(new Float32Array(scat), 3));
  g.setAttribute('aMix', new THREE.BufferAttribute(new Float32Array(mix), 1));
  g.setAttribute('aSeed', new THREE.BufferAttribute(new Float32Array(seed), 1));
  dissolveMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uDiss: { value: 0 }, uTime: { value: 0 }, uIntro: { value: 0 }, uPR: { value: Math.min(devicePixelRatio, 2) } },
    vertexShader: `
      uniform float uDiss, uTime, uIntro, uPR;
      attribute vec3 aScatter; attribute float aMix; attribute float aSeed;
      varying vec3 vCol; varying float vA;
      void main(){
        float d = uDiss;
        vec3 p = position + aScatter * d * (0.8 + aSeed * 1.4);
        float ang = d * (1.6 + aSeed * 3.2);
        float s = sin(ang), c = cos(ang);
        p.xz = mat2(c, -s, s, c) * p.xz;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = (5.0 + aSeed * 9.0) * uPR * (1.0 / max(-mv.z, 0.1));
        gl_Position = projectionMatrix * mv;
        vCol = mix(vec3(1.0,0.45,0.12), vec3(0.10,0.9,0.8), aMix);
        // transitions flash (sin), intro keeps points visible while assembling (uIntro * d)
        vA = max(sin(clamp(d, 0.0, 1.0) * 3.14159), uIntro * d);
      }`,
    fragmentShader: `
      varying vec3 vCol; varying float vA;
      void main(){
        vec2 c = gl_PointCoord - 0.5; float dd = length(c);
        if (dd > 0.5) discard;
        gl_FragColor = vec4(vCol, smoothstep(0.5,0.0,dd) * vA);
      }`
  });
  dissolvePts = new THREE.Points(g, dissolveMat);
  dissolvePts.frustumCulled = false;
  scene.add(dissolvePts);
}

function makeWallpaperTex() {
  // lock-screen: user's wallpaper (cover-fit) + 9:41 clock overlay, rounded-corner clipped
  const cw = 560, ch = Math.round(cw / 0.4624);
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.flipY = true;

  function draw(img) {
    g.clearRect(0, 0, cw, ch);
    if (img) {
      const ir = img.width / img.height, cr = cw / ch;
      let dw, dh, dx, dy;
      if (ir > cr) { dh = ch; dw = ch * ir; dx = (cw - dw) / 2; dy = 0; }
      else { dw = cw; dh = cw / ir; dx = 0; dy = (ch - dh) / 2; }
      g.drawImage(img, dx, dy, dw, dh);
    } else {
      const grd = g.createLinearGradient(0, 0, 0, ch);
      grd.addColorStop(0, '#0a0d14'); grd.addColorStop(1, '#140a06');
      g.fillStyle = grd; g.fillRect(0, 0, cw, ch);
    }
    // clock + date overlay (below the dynamic island)
    g.textAlign = 'center';
    g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = cw * 0.04;
    g.fillStyle = 'rgba(255,255,255,0.97)';
    g.font = '300 ' + Math.round(cw * 0.23) + 'px "Inter", system-ui, sans-serif';
    g.fillText('9:41', cw / 2, ch * 0.205);
    g.fillStyle = 'rgba(255,255,255,0.78)';
    g.font = '500 ' + Math.round(cw * 0.044) + 'px "Inter", system-ui, sans-serif';
    g.fillText('Понедельник, 9 июня', cw / 2, ch * 0.255);
    g.shadowBlur = 0;
    tex.needsUpdate = true;
  }

  draw(null);

function buildScreenPlane() {
  if (!screenMesh) return;
  screenMesh.updateWorldMatrix(true, false);
  const b = new THREE.Box3().setFromObject(screenMesh);
  const c = b.getCenter(new THREE.Vector3());
  const s = b.getSize(new THREE.Vector3());
  // screen faces -X (thickness axis); in-plane dims are Z (width) and Y (height)
  const w = (s.z || 1.29) * 0.995, h = (s.y || 2.77) * 0.995;
  // rounded-rectangle geometry (corners in the mesh, so the texture can be animated freely)
  const r = w * 0.115;
  const shape = new THREE.Shape();
  const x0 = -w / 2, y0 = -h / 2;
  shape.moveTo(x0 + r, y0);
  shape.lineTo(x0 + w - r, y0);
  shape.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r);
  shape.lineTo(x0 + w, y0 + h - r);
  shape.quadraticCurveTo(x0 + w, y0 + h, x0 + w - r, y0 + h);
  shape.lineTo(x0 + r, y0 + h);
  shape.quadraticCurveTo(x0, y0 + h, x0, y0 + h - r);
  shape.lineTo(x0, y0 + r);
  shape.quadraticCurveTo(x0, y0, x0 + r, y0);
  const geo = new THREE.ShapeGeometry(shape, 12);
  const posA = geo.attributes.position, uvA = geo.attributes.uv;
  for (let i = 0; i < posA.count; i++) uvA.setXY(i, (posA.getX(i) - x0) / w, (posA.getY(i) - y0) / h);
  uvA.needsUpdate = true;
  const mat = new THREE.MeshBasicMaterial({
    map: wallpaperTex, transparent: true, opacity: 0,
    depthTest: false, depthWrite: false, side: THREE.DoubleSide, toneMapped: false,
  });
  mat.color.setScalar(0.08); // off (dark) by default
  screenPlane = new THREE.Mesh(geo, mat);
  screenPlane.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), new THREE.Vector3(-1, 0, 0));
  screenPlane.position.set(c.x - (s.y || 2.77) * 0.012, c.y, c.z);  // just in front of the glass
  screenPlane.renderOrder = 13;
  wallpaperTex.center.set(0.5, 0.5);   // pivot for the breathing ken-burns
  scene.add(screenPlane);
}

function shadowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(0,0,0,0.92)'); grd.addColorStop(0.5, 'rgba(0,0,0,0.5)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

function buildFloor(y) {
  // reflective studio floor — faces up, so it only shows from above and vanishes at the low hero angle
  const geo = new THREE.CircleGeometry(modelRadius * 5.5, 64);
  floorRef = new Reflector(geo, { textureWidth: 1024, textureHeight: 1024, color: 0x0a0a0b });
  floorRef.rotation.x = -Math.PI / 2;
  floorRef.position.y = y;
  scene.add(floorRef);
  // soft contact shadow (elongated along the phone's wide axis Z)
  const smat = new THREE.MeshBasicMaterial({ map: shadowTex(), transparent: true, opacity: 0.85, depthWrite: false });
  groundShadow = new THREE.Mesh(new THREE.PlaneGeometry(modelRadius * 0.6, modelRadius * 1.5), smat);
  groundShadow.rotation.x = -Math.PI / 2;
  groundShadow.position.set(0, y + modelRadius * 0.004, 0);
  groundShadow.renderOrder = 1;
  scene.add(groundShadow);
}

let shafts = [];
function buildShafts() {
  // volumetric light shafts (faint, additive) — atmosphere + cold/warm rim rays
  const c = document.createElement('canvas'); c.width = 64; c.height = 256;
  const g = c.getContext('2d');
  const lx = g.createLinearGradient(0, 0, 64, 0);
  lx.addColorStop(0, 'rgba(255,255,255,0)'); lx.addColorStop(0.5, 'rgba(255,255,255,1)'); lx.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = lx; g.fillRect(0, 0, 64, 256);
  const ly = g.createLinearGradient(0, 0, 0, 256);
  ly.addColorStop(0, 'rgba(0,0,0,0)'); ly.addColorStop(0.45, 'rgba(0,0,0,1)'); ly.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalCompositeOperation = 'destination-in'; g.fillStyle = ly; g.fillRect(0, 0, 64, 256);
  const tex = new THREE.CanvasTexture(c);
  const defs = [
    { col: 0x6aa6ff, x: -modelRadius * 2.6, rot: 0.34, op: 0.12 },   // cold rim ray
    { col: 0xff8a3c, x: modelRadius * 2.4, rot: -0.28, op: 0.08 },   // warm ray
  ];
  defs.forEach((d) => {
    const m = new THREE.MeshBasicMaterial({ map: tex, color: d.col, transparent: true, opacity: d.op,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, side: THREE.DoubleSide, toneMapped: false });
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(modelRadius * 2.0, modelRadius * 8), m);
    sh.position.set(d.x, modelRadius * 1.2, -modelRadius * 1.5);
    sh.rotation.z = d.rot;
    sh.renderOrder = -1;
    sh.userData.baseOp = d.op;
    scene.add(sh); shafts.push(sh);
  });
}

/* ============================================================
   EXPLODED VIEW  +  SYNTHETIC INTERNALS  (X-ray beat)
   real shell meshes separate along world-X (thickness);
   glowing internal slabs (A19 / battery / vapor chamber) fan out between them
   ============================================================ */
let explodeLabels = [];
function slab(w, h, makeTex, glowCol) {
  const tex = makeTex();
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0,
    depthWrite: false, side: THREE.DoubleSide, toneMapped: false });
  const geo = new THREE.PlaneGeometry(w, h);
  const m = new THREE.Mesh(geo, mat);
  m.rotation.y = Math.PI / 2;       // face normal along X (slab perpendicular to thickness)
  m.renderOrder = 6;
  // additive glow halo behind the slab
  const halo = new THREE.Mesh(geo.clone(), new THREE.MeshBasicMaterial({ map: tex, transparent: true,
    opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, side: THREE.DoubleSide, toneMapped: false, color: glowCol }));
  m.add(halo); m.userData.halo = halo;
  return m;
}
function texChip() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#0a0f14'; g.fillRect(0, 0, 256, 256);
  g.fillStyle = '#10202a'; g.fillRect(40, 40, 176, 176);
  g.strokeStyle = '#19e6d2'; g.lineWidth = 2;
  for (let i = 0; i <= 8; i++) { const t = 40 + i * 22; g.beginPath(); g.moveTo(t, 40); g.lineTo(t, 216); g.moveTo(40, t); g.lineTo(216, t); g.stroke(); }
  g.fillStyle = '#0c1418'; g.fillRect(86, 86, 84, 84);
  g.fillStyle = '#19e6d2'; g.font = '700 26px JetBrains Mono, monospace'; g.textAlign = 'center'; g.fillText('A19', 128, 122); g.font = '700 17px JetBrains Mono'; g.fillText('PRO', 128, 146);
  // pins
  g.fillStyle = '#caa15a'; for (let i = 0; i < 10; i++) { g.fillRect(40 + i * 19, 20, 10, 16); g.fillRect(40 + i * 19, 220, 10, 16); }
  return new THREE.CanvasTexture(c);
}
function texBattery() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 512; const g = c.getContext('2d');

function buildExplode(model, box) {
  let camMesh = null;
  const W = (box.max.z - box.min.z), H = (box.max.y - box.min.y);
  const factorFor = (nm) => {
    nm = nm.toLowerCase();
    if (/lensinglass/.test(nm)) return 5.0;       // cameras (back, outermost)
    if (/backpanel/.test(nm)) return 4.0;         // back glass
    if (/screen/.test(nm)) return -2.4;           // OLED display
    if (/glass\.002/.test(nm)) return -3.6;       // front cover glass
    return 0;                                     // chassis / frame / body stay anchored
  };
  model.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const nm = mats.map((m) => m && m.name).join(' ') + ' ' + (o.name || '');
    if (/backpanel/.test(nm.toLowerCase())) camMesh = o;   // camera-bump plate (upper back) — label anchor
    const wq = new THREE.Quaternion(); o.parent.getWorldQuaternion(wq);
    const ws = new THREE.Vector3(); o.parent.getWorldScale(ws);
    const dir = PHONE_X.clone().applyQuaternion(wq.invert());
    dir.set(dir.x / ws.x, dir.y / ws.y, dir.z / ws.z);
    explodeLayers.push({ mesh: o, factor: factorFor(nm), base: o.position.clone(), dir });
  });
  // synthetic internal slabs (scene space, exploded along world-X)
  const defs = [
    { f: 3.0, w: W * 0.92, h: H * 0.9,  tex: texVapor,   col: 0x4aa6ff, label: 'Vapor Chamber',  ly: 0,     dy: 120 },
    { f: 2.1, w: W * 0.82, h: H * 0.74, tex: texBattery, col: 0xff8a2a, label: 'Аккумулятор',     ly: -0.05, dy: 188 },
    { f: 1.2, w: W * 0.42, h: W * 0.42, tex: texChip,    col: 0x19e6d2, label: 'A19 Pro',         ly: 0.18,  dy: -150 },
  ];
  defs.forEach((d) => {
    const m = slab(d.w, d.h, d.tex, d.col);
    m.position.set(0, box.getCenter(new THREE.Vector3()).y + d.ly * H, 0);
    m.userData.base = m.position.clone();
    m.userData.factor = d.f;
    scene.add(m);
    internalLayers.push(m);
    explodeLabels.push({ text: d.label, get: () => m.position, dy: d.dy });
  });
  // labels anchored to the real layer meshes (move with the explode automatically)
  const _wp = new THREE.Vector3();
  if (screenMesh) explodeLabels.push({ text: 'OLED-дисплей', get: () => screenMesh.getWorldPosition(_wp), dy: -96 });
  if (camMesh) {
    const _camBox = new THREE.Box3(), _camC = new THREE.Vector3();
    explodeLabels.push({ text: 'Камеры', get: () => { _camBox.setFromObject(camMesh); return _camBox.getCenter(_camC); }, dy: -86 });
  }
  buildExplodeLabels();
}
const _anchTmp = new THREE.Vector3();
function screenWorldAnchor(factor) {
  // world point at given explode factor along X through model center, at current explode amount
  return _anchTmp.set(explodeDist * factor * curExplode, 0, 0);
}

   ============================================================ */
function buildEngrave(model, box) {
  const cw = 1024, ch = 256;
  engraveCanvas = document.createElement('canvas'); engraveCanvas.width = cw; engraveCanvas.height = ch;
  engraveCtx = engraveCanvas.getContext('2d');
  const tex = new THREE.CanvasTexture(engraveCanvas);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  engraveMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0,
    depthWrite: false, side: THREE.DoubleSide, toneMapped: false, blending: THREE.AdditiveBlending });
  const W = (box.max.z - box.min.z), H = (box.max.y - box.min.y);
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(W * 0.62, W * 0.62 * ch / cw), engraveMat);
  // on the back face (+X), lower third, normal +X
  plane.rotation.set(0, -Math.PI / 2, 0);
  plane.scale.x = -1;   // un-mirror the text for the +X viewpoint
  plane.position.set(box.max.x + 0.004, box.getCenter(new THREE.Vector3()).y - H * 0.3, 0);
  plane.renderOrder = 9;
  scene.add(plane);
  engraveMat.userData.plane = plane;
  // spark particles (small, additive), follow the laser head
  const N = 90;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(new Float32Array(Array.from({ length: N }, () => Math.random())), 1));
  sparkMat = new THREE.PointsMaterial({ size: 0.03, color: 0xffd28a, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
  sparkPts = new THREE.Points(g, sparkMat);
  sparkPts.frustumCulled = false;
  sparkPts.userData = { plane, W, H, box };
  scene.add(sparkPts);
}
let engraveDrawn = -1;
function drawEngrave(prog) {
  if (!engraveCtx) return;
  const cw = engraveCanvas.width, ch = engraveCanvas.height;
  engraveCtx.clearRect(0, 0, cw, ch);
  engraveCtx.textAlign = 'left'; engraveCtx.textBaseline = 'middle';
  engraveCtx.font = '600 76px Inter, system-ui, sans-serif';
  const txt = 'iPhone 17 Pro Max';
  const full = engraveCtx.measureText(txt).width;
  const x0 = (cw - full) / 2, y = ch / 2;
  // engraved (done) part — etched look
  const cut = full * THREE.MathUtils.clamp(prog, 0, 1);
  engraveCtx.save();
  engraveCtx.beginPath(); engraveCtx.rect(0, 0, x0 + cut, ch); engraveCtx.clip();
  engraveCtx.fillStyle = 'rgba(255,255,255,0.16)';
  engraveCtx.fillText(txt, x0, y + 2);
  engraveCtx.fillStyle = 'rgba(255,190,120,0.92)';
  engraveCtx.fillText(txt, x0, y);
  engraveCtx.restore();
  // bright laser head glow at the cut
  if (prog > 0.01 && prog < 0.99) {
    const hx = x0 + cut;
    const grd = engraveCtx.createRadialGradient(hx, y, 0, hx, y, 26);
    grd.addColorStop(0, 'rgba(255,235,200,1)'); grd.addColorStop(1, 'rgba(255,160,80,0)');

function buildDroplets(box) {
  dropletGroup = new THREE.Group();
  const frontX = box.min.x;                 // screen/front faces -X
  const H = box.max.y - box.min.y, W = box.max.z - box.min.z;
  const cy = (box.min.y + box.max.y) / 2, cz = (box.min.z + box.max.z) / 2;
  const geo = new THREE.SphereGeometry(1, 20, 16);
  const mat = new THREE.MeshPhysicalMaterial({

/* ============================================================
   SCROLL / PROGRESS
   ============================================================ */
const track = document.getElementById('track');
const progEl = document.getElementById('prog');

/* embedded mode: родительская страница задаёт прогресс скролла через postMessage */
let __extProg = null;
addEventListener('message', (e) => {
  const d = e.data;
  if (d && d.iph3d === 1 && typeof d.p === 'number') __extProg = d.p;
});
function scrollProgress() {
  if (location.hash === '#display') return IDX.display / NSEG;   // deep-link / inspection helper
  if (location.hash === '#finale') return 1.0;
  if (location.hash === '#camera') return IDX.macro / NSEG;
  if (location.hash === '#explode') return IDX.explode / NSEG;
  if (location.hash === '#engrave') return IDX.engrave / NSEG;
  if (location.hash === '#colors') return IDX.colors / NSEG;
  if (location.hash === '#blue') return (IDX.colors + 1) / NSEG;
  if (location.hash === '#silver') return (IDX.colors + 2) / NSEG;
  if (__extProg !== null) return THREE.MathUtils.clamp(__extProg, 0, 1);  // встроенный режим
  const max = track.offsetHeight - innerHeight;
  return max > 0 ? THREE.MathUtils.clamp(scrollY / max, 0, 1) : 0;
}
const smooth = (t) => t * t * (3 - 2 * t);

function sampleKeyframe(p) {
  const seg = p * NSEG;
  const i = Math.min(Math.floor(seg), NSEG - 1);
  const f = smooth(THREE.MathUtils.clamp(seg - i, 0, 1));
  const a = SECTIONS[i], b = SECTIONS[i + 1];
  const L = (k) => a[k] + (b[k] - a[k]) * f;
  return { theta: L('theta'), phi: L('phi'), dist: L('dist'), fov: L('fov'), roll: L('roll'), ty: L('ty'), tx: L('tx') };
}

// peaks at segment midpoints (transitions)
function midBump(p, width) {
  let m = 0;
  for (let i = 0; i < NSEG; i++) {
    const c = (i + 0.5) / NSEG;
    m = Math.max(m, 1 - Math.min(Math.abs(p - c) / width, 1));
  }
  return m;
}
// macro gate centered on section 03 (index 2 -> p = 2/NSEG)
function macroGate(p) {
  const c = IDX.macro / NSEG;
  return 1 - Math.min(Math.abs(p - c) / (0.5 / NSEG * 0.9), 1);
}
// generic gate centered on section i
function sectionGate(i, p, w) {
  const c = i / NSEG;
  return 1 - Math.min(Math.abs(p - c) / ((0.5 / NSEG) * (w || 1)), 1);
}

const cur = { theta: SECTIONS[0].theta, phi: SECTIONS[0].phi, dist: SECTIONS[0].dist,
              fov: SECTIONS[0].fov, roll: SECTIONS[0].roll, ty: 0, tx: 0 };
let activeIdx = -1;

function updateHUD(p) {
  let nearest = 0, nd = 1e9;
  SECTIONS.forEach((s, i) => {
    const center = i / NSEG;
    const d = Math.abs(p - center);
    const span = 0.5 / NSEG;
    const op = THREE.MathUtils.clamp(1 - d / (span * 1.18), 0, 1);
    secEls[i].style.opacity = op.toFixed(3);
    secEls[i].classList.toggle('show', op > 0.55);
    if (d < nd) { nd = d; nearest = i; }
  });
  if (nearest !== activeIdx) {
    activeIdx = nearest;
    triggerCount(nearest);
    if (nearest === IDX.display) powerOnStart = performance.now();   // screen power-on flash on entering Display
  }
  progEl.style.width = (p * 100).toFixed(2) + '%';
}

function triggerCount(i) {
  const s = SECTIONS[i];
  let bi = -1, c = 0;
  for (let k = 0; k < SECTIONS.length; k++) { if (SECTIONS[k].big) { if (k === i) bi = c; c++; } }
  if (!s.big || bi < 0) return;
  const el = bigEls[bi], to = s.big.to, start = performance.now(), dur = 1100;
  function step(now) {
    const t = Math.min((now - start) / dur, 1);
    const e = 1 - Math.pow(1 - t, 3);
    el.firstChild.textContent = Math.round(to * e).toLocaleString('ru-RU');
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
let lastScroll = scrollY, scrollVel = 0, dissCur = 0, lastT = 0, powerOnStart = -1e9;
const camDir = new THREE.Vector3();
const camRight = new THREE.Vector3();
const worldUp = new THREE.Vector3(0, 1, 0);

// pointer parallax
let pxT = 0, pyT = 0, px = 0, py = 0;
if (!MOBILE) addEventListener('pointermove', (e) => {
  pxT = (e.clientX / innerWidth) * 2 - 1;
  pyT = (e.clientY / innerHeight) * 2 - 1;
}, { passive: true });

function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  const dt = Math.min(Math.max(t - lastT, 0.0001), 0.05); lastT = t;

  // scroll velocity (smoothed, 0..1) — в встроенном режиме берём из внешнего прогресса
  const sy = (__extProg !== null) ? (__extProg * 9000) : scrollY;
  const dv = Math.abs(sy - lastScroll); lastScroll = sy;
  const velTarget = REDUCE ? 0 : Math.min(dv / (innerHeight * 0.55), 1);
  scrollVel += (velTarget - scrollVel) * 0.16;

  const p = scrollProgress();
  const kf = sampleKeyframe(p);
  updateHUD(p);

  // intro materialization (phone assembles from particles on first load)
  const introEase = ready ? smooth(THREE.MathUtils.clamp((performance.now() - introStart) / 2000, 0, 1)) : 0;
  const inIntro = introEase < 1;

  // #1 opening title card: branded splash during load, then dissolves as the phone assembles
  if (!titleDone) {
    if (!ready) {
      titleCardEl.style.opacity = '1';
      tcLineEl.style.width = (70 + 170 * (0.5 + 0.5 * Math.sin(t * 2.2))).toFixed(0) + 'px';
    } else if (scrollY < innerHeight * 0.4) {
      const rawT = THREE.MathUtils.clamp((performance.now() - introStart) / 2000, 0, 1);
      tcLineEl.style.width = '240px';
      const fade = 1 - smooth(THREE.MathUtils.clamp((rawT - 0.4) / 0.5, 0, 1));
      titleCardEl.style.opacity = fade.toFixed(3);
      titleCardEl.style.transform = 'scale(' + (1 + (1 - fade) * 0.05).toFixed(3) + ')';
      if (rawT >= 1) { titleCardEl.style.display = 'none'; titleDone = true; }
    } else {
      titleCardEl.style.display = 'none'; titleDone = true;
    }
  }

  // #3 rhythm beat blackout — removed per request
  beatFadeEl.style.opacity = '0';
  // pointer parallax easing
  px += (pxT - px) * 0.05; py += (pyT - py) * 0.05;

  // frame-rate-independent smoothing toward keyframe (symmetric, strong easing)
  const k = 1 - Math.pow(0.02, dt); // ~0.06/frame @60 — dramatic glide
  cur.theta += (kf.theta - cur.theta) * k;
  cur.phi   += (kf.phi   - cur.phi)   * k;
  cur.dist  += (kf.dist  - cur.dist)  * k;
  cur.fov   += (kf.fov   - cur.fov)   * k;
  cur.roll  += (kf.roll  - cur.roll)  * k;
  cur.ty    += (kf.ty    - cur.ty)    * k;
  cur.tx    += (kf.tx    - cur.tx)    * k;

  // handheld micro-drift (dutch angle + drift) — damped during close-ups (macro + engraving) for a stable shot
  const engGate = sectionGate(IDX.engrave, p, 0.9);
  const gate = Math.max(macroGate(p), engGate);
  const steady = 1 - THREE.MathUtils.clamp(gate, 0, 1);
  const dr = (REDUCE ? 0 : 1) * steady;
  const driftT = (Math.sin(t * 0.45) * 1.1 + Math.sin(t * 0.21) * 0.7) * dr;
  const driftP = Math.sin(t * 0.37 + 1.3) * 0.9 * dr;
  const driftR = Math.sin(t * 0.30) * 0.7 * dr;

  const theta = THREE.MathUtils.degToRad(cur.theta + driftT + px * 4.5 * steady * (inIntro ? 0 : 1));
  const phi = THREE.MathUtils.degToRad(THREE.MathUtils.clamp(cur.phi + driftP - py * 3.0 * steady * (inIntro ? 0 : 1), 16, 152));

  // FIT logic: never closer than whole-phone fit, except macro (tight) and engraving (moderate close-up)
  const allowedMin = Math.min(
    THREE.MathUtils.lerp(1.0, 0.40, THREE.MathUtils.clamp(macroGate(p), 0, 1)),
    THREE.MathUtils.lerp(1.0, 0.62, THREE.MathUtils.clamp(engGate, 0, 1))
  );
  let dist = Math.max(cur.dist * fitDist, fitDist * allowedMin * 0.99);

  target.set(cur.tx * modelRadius, cur.ty * modelRadius, 0);
  target.x += Math.sin(t * 0.33) * modelRadius * 0.01 * dr;
  target.y += Math.cos(t * 0.27) * modelRadius * 0.01 * dr;

  camera.position.set(
    target.x + dist * Math.sin(phi) * Math.sin(theta),
    target.y + dist * Math.cos(phi),
    target.z + dist * Math.sin(phi) * Math.cos(theta)
  );
  camera.fov = cur.fov;
  camera.up.set(0, 1, 0);
  camera.lookAt(target);
  camera.rotateZ(THREE.MathUtils.degToRad(cur.roll + driftR));
  camera.updateProjectionMatrix();

  // DoF: blur surroundings, sharp centered subject — strongest at macro (sec 03)
  dofPass.uniforms.uStrength.value = 0.55 + THREE.MathUtils.clamp(gate, 0, 1) * 1.7;

  // epic beats: power-on flash (entering Display) + climax beat (Camera->Display swing)
  const powerOn = REDUCE ? 0 : Math.max(0, 1 - (performance.now() - powerOnStart) / 650);
  const powerPulse = powerOn * powerOn;
  const beatC = ((IDX.macro + IDX.display) / 2) / NSEG;   // climax on the Camera→Display swing
  const beat = REDUCE ? 0 : (1 - Math.min(Math.abs(p - beatC) / 0.05, 1));
  bloom.strength = 0.24 + beat * 0.22 + powerPulse * 0.5;
  // anamorphic streaks: keep subtle, and suppress entirely on the macro close-up so dark areas (lidar) stay clean
  anamorphicPass.uniforms.uStrength.value = (0.4 + powerPulse * 0.6 + beat * 0.2) * (1 - 0.95 * THREE.MathUtils.clamp(macroGate(p), 0, 1));

  // glow billboard: behind phone along camera->target axis, faces camera
  camera.getWorldDirection(camDir);
  // travelling studio-strip glint across the metal frame (lights camera-facing side)
  camRight.crossVectors(camDir, worldUp).normalize();
  const sweepX = Math.sin(t * 0.5);
  sweep.position.copy(target)
    .addScaledVector(camDir, -modelRadius * 1.8)
    .addScaledVector(camRight, sweepX * modelRadius * 2.2)
    .addScaledVector(worldUp, modelRadius * 0.6);
  sweep.lookAt(target);
  const designW = 1 - Math.min(Math.abs(p) / (0.5 / NSEG), 1);   // strongest in section 01
  sweep.intensity = (2.4 + 5.0 * designW) * (inIntro ? 0.25 : 1);

  // particles converge into the phone at the finale
  pMat.uniforms.uConverge.value = smooth(THREE.MathUtils.clamp((p - 0.86) / 0.14, 0, 1));
  // live display plane: always present (dark) when facing camera, brightens to lock-screen in Display/finale
  if (screenPlane) {
    const dispW = 1 - Math.min(Math.abs(p - IDX.display / NSEG) / (0.5 / NSEG * 1.1), 1);
    const finW = smooth(THREE.MathUtils.clamp((p - 0.9) / 0.1, 0, 1));
    const lit = Math.max(smooth(dispW), finW);
    const bodyFade = 1 - 0.55 * Math.sin(THREE.MathUtils.clamp(dissCur, 0, 1) * Math.PI);
    const frontness = THREE.MathUtils.clamp(-camera.position.x / (modelRadius * 1.5), 0, 1);
    screenPlane.material.color.setScalar((0.07 + 1.25 * lit) * (1 + powerPulse * 1.6));
    screenPlane.material.opacity = introEase * bodyFade * frontness;
  }

  glow.position.copy(target).addScaledVector(camDir, modelRadius * 1.4);
  glow.quaternion.copy(camera.quaternion);
  // climax boost on sec 03 (camera) & 04 (display)
  const climax = Math.max(
    1 - Math.min(Math.abs(p - 2/NSEG) / (0.5/NSEG), 1),
    1 - Math.min(Math.abs(p - 3/NSEG) / (0.5/NSEG), 1)
  );
  glowMat.uniforms.uInt.value = 0.32 + 0.3 * climax;
  glowMat.uniforms.uTime.value = t;

  // particles
  pMat.uniforms.uTime.value = t;
  pMat.uniforms.uScroll.value = p;
  pMat.uniforms.uBurst.value = Math.max(scrollVel, beat * 0.7);
  // fade particles out on the macro camera close-up so additive orange dots don't bleed over the dark lidar
  pMat.uniforms.uFade.value = 1 - 0.92 * THREE.MathUtils.clamp(macroGate(p), 0, 1);
  // fade volumetric shafts on the macro close-up too (keep dark background clean)
  const shaftFade = 1 - 0.9 * THREE.MathUtils.clamp(macroGate(p), 0, 1);
  for (let i = 0; i < shafts.length; i++) shafts[i].material.opacity = shafts[i].userData.baseOp * shaftFade;

  // dissolve / reassemble at transitions (+ velocity) + intro materialization
  const dissTarget = REDUCE ? 0 : THREE.MathUtils.clamp(Math.max(midBump(p, 0.5/NSEG*0.8), scrollVel * 0.5), 0, 1);
  dissCur += (dissTarget - dissCur) * (1 - Math.pow(0.02, dt));
  const introDiss = 1 - introEase;                 // 1 = fully scattered -> 0 assembled
  const effDiss = Math.max(dissCur, introDiss);
  if (dissolveMat) {
    dissolveMat.uniforms.uDiss.value = effDiss;
    dissolveMat.uniforms.uIntro.value = 1 - introEase;
    dissolveMat.uniforms.uTime.value = t;
  }
  if (ready && phoneMats.length) {
    const fade = (1 - 0.55 * Math.sin(THREE.MathUtils.clamp(dissCur, 0, 1) * Math.PI)) * introEase;
    for (let i = 0; i < phoneMats.length; i++) phoneMats[i].opacity = phoneMats[i]._baseOpacity * fade;
  }

  // ============ WATER DROPLETS — removed per request ============
  if (dropletGroup && dropletGroup.visible) dropletGroup.visible = false;

  // ============ EXPLODED VIEW + X-RAY (section 02) ============
  const exTarget = REDUCE ? 0 : smooth(THREE.MathUtils.clamp(sectionGate(IDX.explode, p, 0.92), 0, 1));
  curExplode += (exTarget - curExplode) * (1 - Math.pow(0.0015, dt));
  if (explodeLayers.length) {
    for (let i = 0; i < explodeLayers.length; i++) {
      const L = explodeLayers[i];
      const d = explodeDist * L.factor * curExplode;
      L.mesh.position.set(L.base.x + L.dir.x * d, L.base.y + L.dir.y * d, L.base.z + L.dir.z * d);
    }
  }
  for (let i = 0; i < internalLayers.length; i++) {
    const m = internalLayers[i];
    m.position.x = m.userData.base.x + explodeDist * m.userData.factor * curExplode;
    m.material.opacity = curExplode;
    if (m.userData.halo) m.userData.halo.material.opacity = curExplode * (0.45 + 0.3 * Math.sin(t * 2 + i));
  }
  // project HUD labels onto the layers
  if (explodeLabels.length) {
    const Wp = innerWidth, Hp = innerHeight;
    for (const L of explodeLabels) {
      if (!L.el) continue;
      if (curExplode < 0.04) { L.el.style.opacity = '0'; continue; }
      _projV.copy(L.get()); _projV.project(camera);
      if (_projV.z > 1) { L.el.style.opacity = '0'; continue; }
      const sx = (_projV.x * 0.5 + 0.5) * Wp, sy = (-_projV.y * 0.5 + 0.5) * Hp;
      const dy = L.dy || -70;
      L.el.style.left = sx.toFixed(1) + 'px';
      L.el.style.top = sy.toFixed(1) + 'px';            // anchor = dot sits exactly on the part
      L.leader.style.top = Math.min(0, dy) + 'px';
      L.leader.style.height = Math.abs(dy) + 'px';
      L.txt.style.top = dy + 'px';
      L.el.style.opacity = (curExplode * 0.97).toFixed(2);
    }
  }

  // ============ COLORWAY SWITCH (3 dedicated sections: Orange→Blue→Silver, turntable) ============
  if (bodyMats.length) {
    const fp = p * NSEG - IDX.colors;                  // 0=Orange · 1=Blue · 2=Silver
    const inCol = THREE.MathUtils.clamp(1 - Math.max(0, Math.max(-(fp + 0.5), fp - 2.5)) / 0.5, 0, 1);
    const fc = THREE.MathUtils.clamp(fp, 0, 2);
    const i0 = Math.min(Math.floor(fc), 1), f = smooth(fc - i0);
    for (const m of bodyMats) {
      (FINISH[i0] ? _fa.copy(FINISH[i0]) : _fa.copy(m._baseColor));
      (FINISH[i0 + 1] ? _fb.copy(FINISH[i0 + 1]) : _fb.copy(m._baseColor));
      _ft.copy(_fa).lerp(_fb, f);
      m.color.copy(m._baseColor).lerp(_ft, inCol);
    }
  }

  // ============ LASER ENGRAVING (dedicated close-up section) ============
  if (engraveMat) {
    const c5 = IDX.engrave / NSEG, half = 0.5 / NSEG;
    // reveal only AFTER the camera has settled into the close-up: starts ~85% through the approach, finishes just past center
    const prog = THREE.MathUtils.clamp((p - (c5 - half * 0.15)) / (half * 0.7), 0, 1);
    const eo = THREE.MathUtils.clamp(sectionGate(IDX.engrave, p, 1.0), 0, 1);
    engraveMat.opacity = eo;
    if (Math.abs(prog - engraveDrawn) > 0.004) { drawEngrave(prog); engraveDrawn = prog; }
    if (sparkPts) {
      const active = eo > 0.05 && prog > 0.02 && prog < 0.985 ? 1 : 0;
      sparkMat.opacity = active;
      if (active) {
        const u = sparkPts.userData, pos = sparkPts.geometry.attributes.position, seed = sparkPts.geometry.attributes.aSeed;
        // text plane has scale.x = -1, so the world print-head runs opposite to canvas progress — match it
        const headZ = -(prog - 0.5) * u.W * 0.6;
        const px = u.box.max.x + 0.01, py = u.plane.position.y;
        for (let i = 0; i < pos.count; i++) {
          const s = seed.getX(i), tt = (t * (1.2 + s) + s * 9) % 1;
          // sparks spray backwards from the head (trailing the cut) + upward scatter
          pos.setXYZ(i, px + tt * 0.12 * s, py + (Math.sin((s + t) * 30) * 0.18) * tt, headZ - tt * 0.10 * (0.4 + s) + (s - 0.5) * 0.05);
        }
        pos.needsUpdate = true;
      }
    }
  }

  // ============ MOTION BLUR (fast scroll) ============
  motionPass.uniforms.uAmt.value = REDUCE ? 0 : Math.min(scrollVel * 0.9, 0.85);
  motionPass.uniforms.uDir.value.set(0.94, 0.34);

  // glitch removed per request
  grainPass.uniforms.uTime.value = t;

  composer.render();
}
tick();

/* ============================================================
   RESIZE
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
  dofPass.uniforms.uTexel.value.set(1 / innerWidth, 1 / innerHeight);
  anamorphicPass.uniforms.uTexel.value.set(1 / innerWidth, 1 / innerHeight);
  motionPass.uniforms.uTexel.value.set(1 / innerWidth, 1 / innerHeight);
});
  </script>
</body>
</html>
